services:
  claude-code:
    image: ghcr.io/thepharmer/claude-dev:latest
    container_name: claude-code
    user: root
    ports:
      - "2222:22"
      - "3001:3001"
      - "60000-61000:60000-61000/udp"
    volumes:
      # Mount the subtrees agents use, not all of /srv - this container runs as root.
      # Keep in sync with docker/compose.yaml; both stacks share these paths.
      - /srv/projects:/srv/projects
      - /srv/chat:/srv/chat
      - /srv/documents:/srv/documents:ro
      - /srv/calibre:/srv/calibre:ro
      - /srv/media:/srv/media:ro
      - claude-config:/claude
      # Agent config on dedicated volumes rather than inside claude-config, so each tool's
      # state can be backed up, inspected and reset independently. The image symlinks
      # ~/.codex -> /codex, ~/.pi -> /pi and ~/.cloudcli -> /cloudcli onto these.
      - codex-config:/codex
      - pi-config:/pi
      - cloudcli-config:/cloudcli
      - /opt/claude-dev/authorized_keys:/home/claude/.ssh/authorized_keys:ro
    # /srv is not a mount; writes directly to it vanish on recreation. (SSH lands in $HOME
    # regardless - this covers docker exec and cloudcli.)
    working_dir: /srv/projects
    environment:
      - TZ=America/Detroit
    healthcheck:
      # curl -f exits non-zero on connection failure or HTTP >=400, which is exactly
      # what the healthcheck wants - no shell or "|| exit 1" needed in exec (CMD) form.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# Paseo is NOT a service here - it runs as its own standalone stack with its own
# credentials, isolated from claude-config. See docker/compose.yaml.

volumes:
  claude-config:
  codex-config:
  pi-config:
  cloudcli-config:
