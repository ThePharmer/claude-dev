# Paseo - standalone stack, independent of the claude-code stack. Deployed via Portainer.
#
# Deliberately shares NOTHING with the claude-config volume: Paseo keeps its own agent
# logins under the paseo-home volume. You log into claude/codex/pi once inside this
# container (see below). Nothing here can read claude-dev's gh token or cloudcli DB, and
# tearing the whole thing down removes only this stack's state.
#
# The only thing shared with claude-dev is the code itself: /srv is bind-mounted at the
# SAME absolute path both containers use, so agent cwd, git worktree paths and any
# absolute paths stay consistent between the two surfaces.
#
# PORTAINER DEPLOYMENT
#   There is deliberately no 'build:' directive here - Portainer does not reliably build
#   images from a stack (see docs: "building images via docker-compose ... is not fully
#   implemented"). CI publishes the image to ghcr instead; this stack only pulls it.
#
#   Required stack environment variables (Portainer -> Stack -> Environment variables):
#     PASEO_PASSWORD    high-entropy value; the daemon is reachable over the tunnel.
#     PASEO_IMAGE_TAG   optional; defaults to 'latest'. Set to 'paseo-test' to run the
#                       branch build before merging to main.
#
#   After first deploy, authenticate each agent once (persists on the paseo-home volume):
#     docker exec -it --user paseo paseo claude
#     docker exec -it --user paseo paseo codex
#     docker exec -it --user paseo paseo pi
#     docker exec -u paseo paseo paseo ls      # confirm Paseo sees all three

services:
  paseo:
    # Pre-built by .github/workflows/docker-image.yml. Tag is overridable so a test stack
    # can run the branch image without touching whatever ':latest' points at.
    image: ghcr.io/thepharmer/paseo-agents:${PASEO_IMAGE_TAG:-latest}
    container_name: paseo
    restart: unless-stopped

    # Host-port model, matching how the separate cloudflared stack already reaches
    # cloudcli on :3001. Protected by the Paseo password + Cloudflare Access, not by
    # network isolation.
    ports:
      - "6767:6767"

    volumes:
      # Paseo daemon state AND all agent credentials (.claude, .codex, plus Pi's XDG
      # dirs) - the base image points every agent config path under /home/paseo, so this
      # one volume is the whole persistence story.
      - paseo-home:/home/paseo
      # Same absolute path as claude-code uses, so paths line up across both containers.
      - /srv:/srv

    # Base image defaults to /workspace, which isn't mounted here.
    working_dir: /srv

    environment:
      TZ: America/Detroit
      # Supplied as a Portainer stack environment variable. The ':?' form fails the deploy
      # immediately if it is unset, rather than silently starting an unauthenticated
      # daemon; the image entrypoint independently fails closed as a second guard.
      PASEO_PASSWORD: ${PASEO_PASSWORD:?set PASEO_PASSWORD in the Portainer stack environment variables}
      # Required because Paseo is reached by DNS name through the Cloudflare tunnel.
      # IPs and localhost stay allowed by default, so host-IP testing still works.
      # NOTE: this must match the Host header Paseo actually RECEIVES. If the cloudflared
      # connector sets httpHostHeader it rewrites that header and requests 403 even though
      # the route is correct - see README troubleshooting.
      PASEO_HOSTNAMES: "paseo.example.com"

    # Uses node (guaranteed present in this Node 22 base) rather than assuming curl is
    # installed in the image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6767/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # Portainer prefixes this with the stack name. Holds Paseo state + all three agents'
  # logins - back it up before recreating the stack if you don't want to re-authenticate.
  paseo-home:
