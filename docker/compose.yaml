# Paseo, deployed as a Portainer stack. Name the stack "paseo" (volume is paseo_paseo-home).
# Tearing down: never use '-v'. It destroys the volume holding every agent login.

services:
  paseo:
    image: ghcr.io/thepharmer/paseo-agents:${PASEO_IMAGE_TAG:-latest}
    # PASEO_IMAGE_TAG also selects the relay image tag below.
    container_name: paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - paseo-home:/home/paseo
      - /srv/projects:/srv/projects
      - /srv/chat:/srv/chat
      - /srv/documents:/srv/documents:ro
      - /srv/calibre:/srv/calibre:ro
      - /srv/media:/srv/media:ro
      # /srv itself is not a mount; writes outside these paths vanish on recreation.
    working_dir: /srv/projects
    environment:
      TZ: America/Detroit
      SHELL: /bin/bash
      PASEO_PASSWORD: ${PASEO_PASSWORD:?PASEO_PASSWORD must be set as an environment variable}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES}
      # cloudflared reaches the daemon across the docker bridge, not loopback.
      PASEO_TRUSTED_PROXIES: loopback,172.16.0.0/12
      # Relay: self-hosted, for the phone app. See docker/paseo/README.md "Relay".
      # Relay sessions skip PASEO_PASSWORD and PASEO_HOSTNAMES; the pairing link is the
      # credential. Treat the QR like the password. Revoking one phone revokes all.
      PASEO_RELAY_ENABLED: "true"
      PASEO_RELAY_ENDPOINT: paseo-relay:4000
      PASEO_RELAY_USE_TLS: "false"
      # Public endpoint advertised in the pairing QR: the relay's tunnel hostname.
      # Kept out of the repo on purpose; set it in the Portainer stack env.
      PASEO_RELAY_PUBLIC_ENDPOINT: ${PASEO_RELAY_PUBLIC_ENDPOINT:?PASEO_RELAY_PUBLIC_ENDPOINT must be set (host:443 of the relay's tunnel hostname)}
      PASEO_RELAY_PUBLIC_USE_TLS: "true"
    depends_on:
      paseo-relay:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6767/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  paseo-relay:
    # getpaseo/paseo-relay, built by CI from docker/paseo-relay at a pinned commit.
    # Plain HTTP; TLS terminates at Cloudflare. Only /ws may be public: the tunnel
    # hostname rule must 404 everything else so /health, /ready, /metrics stay LAN-only.
    image: ghcr.io/thepharmer/paseo-relay:${PASEO_IMAGE_TAG:-latest}
    container_name: paseo-relay
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PASEO_RELAY_HOST: 0.0.0.0
      PASEO_RELAY_PORT: "4000"
      # 384 MiB of the 512 MiB cap: the relay sheds sockets instead of being OOM-killed.
      PASEO_RELAY_MEMORY_WATERMARK_BYTES: "402653184"
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      # Image has bash but no curl. /ready is 503 until the node accepts work.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/4000; printf "GET /ready HTTP/1.0\r\n\r\n" >&3; head -n1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paseo-home:
  # Daemon state and ALL agent logins.
