# Paseo, deployed as a Portainer stack. Keep the stack name "paseo" (volume is paseo_paseo-home)
# even though the container is "pharm-dev"; renaming the stack orphans the volume.
# Tearing down: never use '-v'. It destroys the volume holding every agent login.

services:
  paseo:
    image: ghcr.io/thepharmer/pharm-dev:${PHARM_DEV_IMAGE_TAG:-latest}
    container_name: pharm-dev
    restart: unless-stopped
    # AppArmor is loaded on the Docker host.
    # The seccomp file must also be copied into Portainer at this path.
    # See paseo/security/README.md.
    security_opt:
      - seccomp=/data/paseo-codex-bwrap.json
      - apparmor=paseo-codex-bwrap
    ports:
      - "6767:6767"
    volumes:
      - paseo-home:/home/paseo
      - /srv/projects:/srv/projects
      - /srv/chat:/srv/chat
      - /srv/documents:/srv/documents:ro
      - /srv/calibre:/srv/calibre:ro
      - /srv/media:/srv/media:ro
      # /srv itself is not a mount; writes outside these paths vanish on recreation.
    working_dir: /srv/projects
    environment:
      TZ: America/Detroit
      SHELL: /bin/bash
      PASEO_PASSWORD: ${PASEO_PASSWORD:?PASEO_PASSWORD must be set as an environment variable}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES}
      # cloudflared reaches the daemon across the docker bridge, not loopback.
      PASEO_TRUSTED_PROXIES: loopback,172.16.0.0/12
      # PASEO_RELAY_ENABLED is left unset on purpose, so the daemon uses Paseo's default
      # relay. compose.relay.yaml swaps in a self-hosted one; set it to "false" to turn the
      # relay off entirely.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6767/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  paseo-home:
  # Daemon state and ALL agent logins.
