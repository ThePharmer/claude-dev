# Paseo, deployed as a Portainer stack. Name the stack "paseo" (volume is paseo_paseo-home).
# Tearing down: never use '-v'. It destroys the volume holding every agent login.

services:
  paseo:
    image: ghcr.io/thepharmer/paseo-agents:${PASEO_IMAGE_TAG:-latest}
    container_name: paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - paseo-home:/home/paseo
      - /srv/projects:/srv/projects
      - /srv/chat:/srv/chat
      - /srv/documents:/srv/documents:ro
      - /srv/calibre:/srv/calibre:ro
      - /srv/media:/srv/media:ro
      # /srv itself is not a mount; writes outside these paths vanish on recreation.
    working_dir: /srv/projects
    environment:
      TZ: America/Detroit
      SHELL: /bin/bash
      PASEO_PASSWORD: ${PASEO_PASSWORD:?PASEO_PASSWORD must be set as an environment variable}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES}
      # cloudflared reaches the daemon across the docker bridge, not loopback.
      PASEO_TRUSTED_PROXIES: loopback,172.16.0.0/12
      # Relay stays off. The phone connects through Cloudflare Access with service-token
      # headers (getpaseo/paseo#4290). The self-hosted relay is staged on the `relay` branch.
      PASEO_RELAY_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6767/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  paseo-home:
  # Daemon state and ALL agent logins.
